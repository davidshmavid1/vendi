name: Backend

on:
  # Every PR runs this job: "checks" is a required status check on main, and a
  # path filter would leave frontend-only PRs waiting for a check that never runs.
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vendi_backend_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendi -d vendi_backend_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway CI database; not a real credential.
      BACKEND_DATABASE_URL: postgres://vendi:ci-only-password@localhost:5432/vendi_backend_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate
      - run: uv run pytest
